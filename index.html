    <script>
      // Motyw ustawiony przed pierwszym malowaniem, żeby ekran nie mrugał na jasno.
      var motyw = null
      try {
        motyw = JSON.parse(localStorage.getItem('kratka:motyw'))
      } catch (e) {}
      if (motyw === 'ciemny' || (!motyw && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('ciemny')
      }
    </script>
